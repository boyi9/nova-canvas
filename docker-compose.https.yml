# 本地 HTTPS 覆盖文件（自签名证书）。
#
# 用法：
#   cd web && pnpm cert                     # 生成 web/certs/dev-cert.pem / dev-key.pem
#   cd .. && docker compose -f docker-compose.local.yml -f docker-compose.https.yml up -d --build
#
# 访问：
#   https://localhost:3443                  （自签名证书，首次访问需在浏览器确认）
#   http://localhost:3000                   （仍保留 HTTP，便于健康检查/回退）
#
# 说明：挂载的是整个 web/certs 目录而不是单个文件，
# 目录不存在时 Docker 会创建空目录，nginx 启动会因找不到证书失败——先跑 pnpm cert。

services:
  app:
    ports:
      - "3443:443"
    volumes:
      - ./web/certs:/etc/nginx/certs:ro
      - ./docker/nginx/tls.conf:/etc/nginx/conf.d/tls.conf:ro
