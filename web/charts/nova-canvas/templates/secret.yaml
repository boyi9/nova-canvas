apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nova-canvas.fullname" . }}-db-secret
  labels:
    app: {{ include "nova-canvas.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.postgresqlPassword | b64enc }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.grafana.adminPassword | b64enc }}
  REDIS_PASSWORD: ""
  API_SECRET_KEY: {{ .Values.security.extraSecretKeys.apiSecretKey | b64enc }}
  SESSION_SECRET: {{ .Values.security.extraSecretKeys.sessionSecret | b64enc }}
{{- if .Values.security.extraSecretKeys }}
{{- range .Values.security.extraSecretKeys }}
  {{ .name }}: {{ .value | b64enc }}
{{- end }}
{{- end }}
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.postgresqlPassword }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.grafana.adminPassword }}
  REDIS_PASSWORD: ""
  API_SECRET_KEY: "{{ .Values.security.extraSecretKeys.apiSecretKey }}"
  SESSION_SECRET: "{{ .Values.security.extraSecretKeys.sessionSecret }}"
{{- if .Values.security.extraSecretKeys }}
{{- range .Values.security.extraSecretKeys }}
  {{ .name }}: {{ .value }}
{{- end }}
{{- end }}