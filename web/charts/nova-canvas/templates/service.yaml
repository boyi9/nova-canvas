apiVersion: v1
kind: Service
metadata:
  name: {{ include "nova-canvas.fullname" . }}
  labels:
    app: {{ include "nova-canvas.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app: {{ include "nova-canvas.name" . }}
    release: {{ .Release.Name }}
{{- with .Values.extraServiceSelectorLabels }}
  labels:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.sessionAffinity }}
  sessionAffinity: {{ . }}
{{- end }}