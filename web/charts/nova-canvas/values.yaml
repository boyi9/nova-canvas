fullnameOverride: ""

common:
  enabled: true
  namespace: nova-canvas
  repository: registry.nova-canvas.com
  tag: "1.0.0"

redis:
  enabled: true
  auth:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard

postgresql:
  enabled: true
  auth:
    enabled: true
    postgresqlPassword: ${POSTGRES_PASSWORD}
    postgresUsername: postgres
    postgresDatabase: nova_canvas
  persistence:
    enabled: true
    size: 5Gi
    storageClass: pg-standard

certmanager:
  enabled: true
  install: true
  defaultIssuer: letsencrypt-production
  production:
    email: ops@nova-canvas.com
    server: https://acme-v02.api.letsencrypt.org/directory

monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  grafana:
    enabled: true
    adminPassword: ${GRAFANA_ADMIN_PASSWORD}

agent:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    - name: NODE_ENV
      value: "production"
    - name: REDIS_URL
      value: "redis://redis:6379"
    - name: DATABASE_URL
      value: "postgresql://postgres:${POSTGRES_PASSWORD}@postgresql:5432/nova_canvas"

scheduler:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations: {
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api.nova-canvas.com
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: dashboard.nova-canvas.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: nova-canvas-tls
      hosts:
        - api.nova-canvas.com
        - dashboard.nova-canvas.com

resources: {}
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
 
tolerations: []

affinity: {}

replicaCount: 2

image:
  repository: registry.nova-canvas.com/nova-canvas
  pullPolicy: IfNotPresent
  tag: "1.0.0"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1
  type: OnDelete

autoscaler:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
 
tolerations: []

affinity: {}

priorityClassName: ""

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 10

resources: {}
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

terminationGracePeriodSeconds: 30

priorityClassName: ""

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

securityContext: {}

backups:
  enabled: false
  schedule: "0 2 * * *"
  retentionDays: 30
  storageClass: standard

persistence:
  enabled: true
  size: 5Gi
  storageClass: standard

extraVolumeMounts: []
extraVolumes: []
extraArgs: []

nodeExporter:
  enabled: true
  port: 9100

kubeStateMetrics:
  enabled: true

horizontalPodAutoscaler: enabled