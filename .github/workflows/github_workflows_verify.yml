
verify:
  runs-on: ubuntu-latest
  name: 验证
  needs: test

env:
  CI_REPORTS: "1"
  PYTHONPATH: ${{ github.workspace }}/.local

steps:
  - name: 检出代码仓库
    uses: actions/checkout@v5
  - name: 下载构建产物
    uses: actions/download-artifact@v4
    with:
      name: 构建报告
      path: dist/
  - name: 设置 Python 环境
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'
  - name: 安装项目依赖
    run: |
      python -m pip install --upgrade pip
      pip install --user -r requirements.txt
  - name: 安装安全扫描工具
    run: pip install --user safety
  - name: 执行安全扫描
    run: |
      safety check --full-report > security-scan-report.txt
    env:
      CI_REPORTS: "1"
  - name: 上传验证报告工件
    uses: actions/upload-artifact@v4
    if: always()
    with:
      name: 验证报告
      path: security-scan-report.txt
