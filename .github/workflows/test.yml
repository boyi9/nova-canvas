name: CI/CD Pipeline

# 已禁用自动触发：cd backend 不跨 step（后续 run go test 仍在仓库根），该流水线必然失败。
# 修复后可恢复 push/pull_request 触发；当前仅保留手动入口。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Set workdir
        run: cd backend
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./internal/script/... ./internal/taskqueue/... -v  # 确保路径正确

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Run security scan
        run: |
          cd backend
          go vet ./...
      - name: Check for vulnerabilities
        run: |
          cd backend
          go list -m all | grep -i vulnerable || echo "No known vulnerabilities found"
