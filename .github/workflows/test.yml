name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          cd backend
          go mod tidy

      - name: Run unit tests
        run: |
          cd backend
          go test ./internal/script/... ./internal/taskqueue/... -v

      - name: Run integration tests
        run: |
          cd backend
          go test ./internal/aimodel/... ./internal/database/... -v

      - name: Lint
        run: |
          cd backend
          go vet ./...

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          cd backend
          go vet ./...

      - name: Check for vulnerabilities
        run: |
          cd backend
          go list -m all | grep -i vulnerable || echo "No known vulnerabilities found"
