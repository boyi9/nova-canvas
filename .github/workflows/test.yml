name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5  # 升级到 V5
      - name: Set up Go
        uses: actions/setup-go@v5  # 升级到 V5
        with:
          go-version: '1.25'
      - name: Set workdir
        run: cd backend
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./internal/script/... ./internal/taskqueue/... -v

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          cd backend
          go vet ./...

      - name: Check for vulnerabilities
        run: |
          cd backend
          go list -m all | grep -i vulnerable || echo "No known vulnerabilities found"
