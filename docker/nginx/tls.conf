# 本地 HTTPS（自签名证书）。
#
# 默认不加载：只有使用 docker-compose.https.yml 覆盖时才挂载到 /etc/nginx/conf.d/tls.conf。
# 证书由 `cd web && pnpm cert` 生成，挂载到 /etc/nginx/certs/。
#
# 生产环境请换掉自签名证书（Let's Encrypt / 企业证书），并考虑追加 HSTS：
#   add_header Strict-Transport-Security "max-age=31536000" always;
# 本地自签名证书不要加 HSTS，否则浏览器会长期拒绝回退 HTTP。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:NOVA_TLS:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/security-headers.inc;
    include /etc/nginx/static.inc;
}
