# Nova Canvas Docker Compose - 开发环境一键启动
# INFRA-003: 开发环境、自动化测试环境部署完成
# 对应 Task: S1-W2-D5-02, S1-W2-D5-03

version: '3.8'

services:
  # ============ 基础设施 ============
  postgres:
    image: postgres:16-alpine
    container_name: nova-canvas-postgres
    environment:
      POSTGRES_DB: nova_canvas
      POSTGRES_USER: nova_canvas
      POSTGRES_PASSWORD: nova_canvas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_canvas -d nova_canvas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-canvas-network

  redis:
    image: redis:7-alpine
    container_name: nova-canvas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-canvas-network

  # ============ 后端服务 ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nova-canvas-backend
    environment:
      - GIN_MODE=debug
      - DB_DSN=postgres://nova_canvas:nova_canvas_dev@postgres:5432/nova_canvas?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=dev-secret-change-in-production
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONPATH=/app/backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app/backend
      - ./web:/app/web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nova-canvas-network
    command: >
      sh -c "go run cmd/main.go"

  # ============ MCP Server (stdio 模式不需要单独容器，供 Agent 调用) ============
  # mcp-server:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.mcp
  #   container_name: nova-canvas-mcp
  #   environment:
  #     - DB_DSN=postgres://nova_canvas:nova_canvas_dev@postgres:5432/nova_canvas?sslmode=disable
  #     - REDIS_ADDR=redis:6379
  #   volumes:
  #     - ./backend:/app/backend
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - nova-canvas-network

  # ============ 前端开发服务器 ============
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: nova-canvas-frontend
    environment:
      - VITE_API_BASE=http://localhost:8080
      - VITE_WS_BASE=ws://localhost:8080
    ports:
      - "3000:3000"
      - "24678:24678"  # Vite HMR
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    depends_on:
      - backend
    networks:
      - nova-canvas-network
    command: >
      sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 3000"

  # ============ Ollama (本地模型) ============
  ollama:
    image: ollama/ollama:latest
    container_name: nova-canvas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nova-canvas-network
    # 启动后自动拉取模型
    command: >
      sh -c "ollama serve & sleep 5 && 
      ollama pull deepseek-r1:7b && 
      ollama pull qwen2.5:7b && 
      ollama pull nemotron-mini:4b && 
      ollama pull llama3.2:3b && 
      ollama pull nomic-embed-text && 
      wait"

volumes:
  postgres_data:
  redis_data:
  ollama_models:

networks:
  nova-canvas-network:
    driver: bridge